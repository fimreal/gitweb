    // ---------- 文件树 ----------
    async function loadFileTree() {
        const content = document.getElementById('floating-tree-content');
        const zh = currentLang === 'zh';
        try {
            const resp = await authFetch('/api/sites/' + pathID + '/tree' + refQuery());
            if (!resp.ok) {
                allFiles = [];
                const msg = httpErrorMsg(resp, '加载文件树失败（' + resp.status + '）', 'Failed to load tree (' + resp.status + ')');
                if (content) content.innerHTML = '<div class="tree-error">' + msg + '</div>';
                toast.error(msg);
                return;
            }
            const data = await resp.json();
            allFiles = data.files || [];
            renderFilteredTree();
        } catch (err) {
            allFiles = []; // 清空旧分支文件列表，避免 autoOpenDefault 用过期列表发请求
            const msg = zh ? '加载文件树失败: ' + err.message : 'Failed to load tree: ' + err.message;
            if (content) content.innerHTML = '<div class="tree-error">' + msg + '</div>';
            toast.error(msg);
        }
    }

    function buildTree(files) {
        const root = { _files: [], _dirs: {} };
        files.forEach(file => {
            const parts = file.path.split('/');
            let cur = root;
            for (let i = 0; i < parts.length - 1; i++) {
                if (!cur._dirs[parts[i]]) cur._dirs[parts[i]] = { _files: [], _dirs: {} };
                cur = cur._dirs[parts[i]];
            }
            cur._files.push({ name: parts[parts.length - 1], path: file.path, size: file.size });
        });
        return root;
    }

    function renderTree(files) {
        const container = document.getElementById('floating-tree-content');
        if (!files.length) { container.innerHTML = '<div class="tree-empty">' + (currentLang === 'zh' ? '空仓库' : 'Empty repo') + '</div>'; return; }
        container.innerHTML = renderNode(buildTree(files), 0);
        attachTreeEvents();
        markCachedRows(); // 行 DOM 是重建的，标记必须跟着重打一遍
    }

    // 图标内联 SVG（class 受 CSS 控制，颜色随状态切换）
    const ICON = {
        chevron: '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
        chevronSpacer: '<span class="chevron-spacer" aria-hidden="true"></span>',
        folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
        file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>'
    };

    function renderNode(node, level) {
        let html = '';
        Object.keys(node._dirs).sort().forEach(dir => {
            html += '<div class="folder-item" data-level="' + level + '" style="padding-left:' + (level * 14 + 6) + 'px">'
                + ICON.chevron + '<span class="folder-icon">' + ICON.folder + '</span><span class="folder-name">' + escapeHtml(dir) + '</span></div>'
                + '<div class="folder-children" style="display:none">' + renderNode(node._dirs[dir], level + 1) + '</div>';
        });
        node._files.sort((a, b) => a.name.localeCompare(b.name));
        node._files.forEach(file => {
            html += '<div class="file-item" data-path="' + escapeHtml(file.path) + '" data-level="' + level + '" style="padding-left:' + (level * 14 + 6) + 'px">'
                + ICON.chevronSpacer + '<span class="file-icon">' + ICON.file + '</span><span class="file-name">' + escapeHtml(file.name) + '</span>'
                + '<span class="file-size">' + (file.size > 0 ? formatSize(file.size) : '') + '</span></div>';
        });
        return html;
    }

    function attachTreeEvents() {
        document.querySelectorAll('.file-item').forEach(item => {
            item.addEventListener('click', () => {
                const path = item.dataset.path;
                loadFile(path);
                document.querySelectorAll('.file-item').forEach(f => f.classList.remove('active'));
                item.classList.add('active');
            });
        });
        document.querySelectorAll('.folder-item').forEach(item => {
            item.addEventListener('click', () => {
                const next = item.nextElementSibling;
                if (next && next.classList.contains('folder-children')) {
                    const open = next.style.display !== 'none';
                    next.style.display = open ? 'none' : 'block';
                    item.classList.toggle('open', !open);
                }
            });
        });
    }

    // ---------- 文件搜索 ----------
    // 只在已拉到的文件列表上做前端过滤：不为搜索多打接口，输入即出结果。
    // 空串回到目录树，非空串平铺展示命中文件（带上完整路径，避免同名文件分不清）。
    let treeQuery = '';

    // 命中片段高亮：下标按小写副本定位，切片仍取原串，大小写保持原样。
    function highlightPath(path, needle) {
        const lower = path.toLowerCase();
        let out = '';
        let from = 0;
        let at = lower.indexOf(needle);
        while (at !== -1) {
            out += escapeHtml(path.slice(from, at))
                + '<mark class="ft-mark">' + escapeHtml(path.slice(at, at + needle.length)) + '</mark>';
            from = at + needle.length;
            at = lower.indexOf(needle, from);
        }
        return out + escapeHtml(path.slice(from));
    }

    function renderSearchResults(files, query) {
        const container = document.getElementById('floating-tree-content');
        if (!container) return;
        const needle = query.toLowerCase();
        const matches = files
            .filter(f => f.path.toLowerCase().indexOf(needle) !== -1)
            .sort((a, b) => a.path.localeCompare(b.path));
        if (!matches.length) {
            container.innerHTML = '<div class="tree-empty">' + (currentLang === 'zh' ? '没有匹配的文件' : 'No matching files') + '</div>';
            return;
        }
        container.innerHTML = matches.map(f =>
            '<div class="file-item search-hit" data-path="' + escapeHtml(f.path) + '" title="' + escapeHtml(f.path) + '">'
            + ICON.chevronSpacer + '<span class="file-icon">' + ICON.file + '</span>'
            + '<span class="file-name">' + highlightPath(f.path, needle) + '</span>'
            + '<span class="file-size">' + (f.size > 0 ? formatSize(f.size) : '') + '</span></div>'
        ).join('');
        attachTreeEvents();
        markCachedRows(); // 与目录树一样，行重建后要重打缓存标记
    }

    // 树与搜索结果共用一个入口：切隐藏文件、刷新、换分支后当前关键词继续生效。
    function renderFilteredTree() {
        const files = visibleFiles();
        if (treeQuery) renderSearchResults(files, treeQuery);
        else renderTree(files);
    }

    // ---------- 搜索框折叠 ----------
    // 所有布局一律默认收起，点标题栏的放大镜才展开。早先按面板宽度分档（窄侧栏默认
    // 展开）的规则已作废：同一块面板会被停靠成侧栏或页底长栏，宽度驱动的默认态在
    // 两种布局下都留了一个「凭空多占一行」的默认值，不如统一收起、按需打开。
    let searchOpen = false;

    function setSearchOpen(open, opts) {
        opts = opts || {};
        const wrap = document.getElementById('floating-tree-search');
        const toggle = document.getElementById('tree-search-toggle');
        const input = document.getElementById('tree-search');
        const clear = document.getElementById('tree-search-clear');
        if (!wrap) return;
        searchOpen = !!open;
        wrap.dataset.open = searchOpen ? 'true' : 'false';
        if (toggle) {
            toggle.classList.toggle('open', searchOpen);
            toggle.setAttribute('aria-expanded', searchOpen ? 'true' : 'false');
        }
        if (!searchOpen) {
            // 收起 = 回到完整目录树：留着关键词会让树看起来缺文件
            if (input && input.value) input.value = '';
            if (clear) clear.hidden = true;
            if (treeQuery) { treeQuery = ''; renderFilteredTree(); }
        } else if (opts.focus && input) {
            setTimeout(() => input.focus(), 180); // 等高度动画把输入框露出来
        }
    }

    function initTreeSearch() {
        const input = document.getElementById('tree-search');
        const clear = document.getElementById('tree-search-clear');
        const toggle = document.getElementById('tree-search-toggle');
        if (!input) return;
        let timer = null;
        const sync = () => {
            treeQuery = input.value.trim();
            if (clear) clear.hidden = input.value.length === 0;
            renderFilteredTree();
        };
        input.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(sync, 120); // 连打时不逐键重建整棵树
        });
        // 输入框内按键不冒泡：Escape 在全局还会关设置菜单/分支菜单，这里要自己消费掉
        input.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if (e.key === 'Escape') {
                clearTimeout(timer);
                input.value = '';
                sync();
            }
        });
        if (clear) clear.addEventListener('click', () => { input.value = ''; sync(); input.focus(); });
        if (toggle) toggle.addEventListener('click', () => setSearchOpen(!searchOpen, { focus: !searchOpen }));
    }

    // ---------- 内容区等待标签 ----------
    // 真正的进度在标题栏下沿那条线上（TopBar），这里只留一句「在等什么」。
    function showLoadingProgress(area, label) {
        area.innerHTML = '<div class="loading-progress">' + label + '</div>';
    }

    // 读 body，并把真实字节比例报给顶部进度条。token 是 authFetch 挂在 resp.__tb 上的，
    // 必须在本函数第一个 await 之前同步 adopt —— 否则 armRelease 的宏任务会先把条收掉。
    // 拿不到 content-length 时不 tick，让缓动继续兜着。
    async function readWithProgress(resp) {
        const token = resp.__tb;
        if (token) TopBar.adopt(token);
        const total = parseInt(resp.headers.get('content-length') || '0', 10);
        try {
            if (!resp.body || !total) return await resp.text();
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let received = 0;
            let result = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                received += value.length;
                result += decoder.decode(value, { stream: true });
                TopBar.tick(received, total);
            }
            result += decoder.decode();
            return result;
        } finally {
            if (token) TopBar.end(token);
        }
    }

    // ---------- 已加载内容缓存 ----------
    // 来回切文件、切走再切回，不该每次重走一遍网络。命中时直接渲染，进度条压根不出现。
    // 键带 currentRef 与 raw 标志：同一 path 在不同 ref、或「渲染片段 / 原始源码」两种形态
    // 下内容完全不同，少一个维度就会串内容。
    var contentCache = (function () {
        var map = new Map();      // key -> { text, size }；Map 保持插入序，即 LRU 序
        var bytes = 0;
        var MAX_BYTES = 10 * 1048576; // 总量上限约 10MB
        var MAX_ITEM = 2 * 1048576;   // 单文件超 2MB 不存：很少开第二次，却会把内存吃掉
        function key(path, raw) { return currentRef + '|' + (raw ? 'r' : 'v') + '|' + path; }
        return {
            get: function (path, raw) {
                var k = key(path, raw);
                var hit = map.get(k);
                if (!hit) return null;
                map.delete(k);
                map.set(k, hit); // 摸一下 = 最近使用，挪到队尾
                return hit.text;
            },
            set: function (path, raw, text) {
                if (text.length > MAX_ITEM) return;
                var k = key(path, raw);
                if (map.has(k)) { bytes -= map.get(k).size; map.delete(k); }
                map.set(k, { text: text, size: text.length });
                bytes += text.length;
                while (bytes > MAX_BYTES && map.size > 1) {
                    var oldest = map.keys().next().value;
                    bytes -= map.get(oldest).size;
                    map.delete(oldest);
                }
                markCachedRows();
            },
            // has 只查询，不 bump LRU —— 鼠标扫过不等于「刚用过」。
            has: function (path) { return map.has(key(path, false)) || map.has(key(path, true)); },
            clear: function () { map.clear(); bytes = 0; markCachedRows(); }
        };
    })();

    // 文件树行末的小圆点：标记「这个文件的内容已在手，再开秒出」。没这个点，用户无从
    // 知道哪些文件是零网络的，也解释不了为什么这次进度条没出现。
    // 一律从缓存反推整棵树，而不是只给刚写入的那一行打点：LRU 淘汰会悄悄让某个点失效，
    // 留着不放就成了撒谎的标识。
    function markCachedRows() {
        var tip = currentLang === 'zh' ? '内容已缓存，再开秒出' : 'Cached — reopens instantly';
        document.querySelectorAll('.file-item[data-path]').forEach(function (item) {
            var cached = contentCache.has(item.dataset.path);
            item.classList.toggle('cached', cached);
            if (cached) item.title = tip; else item.removeAttribute('title');
        });
    }

    // ---------- 文件加载 ----------
    // 以源码模式加载文件（raw=1 拿原始字节，pre/code 展示）。供「显示源代码」按钮和
    // 源码模式下切换文件复用。图片无源码概念，调用方应自行跳过。
    async function loadFileSource(path) {
        const area = document.getElementById('content-area');
        const cached = contentCache.get(path, true);
        if (cached !== null) {
            renderTextWithPagination(area, path, '<pre><code>' + escapeHtml(cached) + '</code></pre>');
            return;
        }
        showLoadingProgress(area, currentLang === 'zh' ? '加载源码...' : 'Loading source...');
        try {
            const resp = await authFetch('/' + pathID + '/' + encodeURI(path) + refQuery() + '&raw=1');
            if (!resp.ok) {
                const msg = httpErrorMsg(resp, '加载失败（' + resp.status + '）', 'Failed (' + resp.status + ')');
                area.innerHTML = '<div class="error">' + msg + '</div>';
                toast.error(msg);
                return;
            }
            const text = await readWithProgress(resp);
            contentCache.set(path, true, text);
            renderTextWithPagination(area, path, '<pre><code>' + escapeHtml(text) + '</code></pre>');
        } catch (err) {
            const msg = currentLang === 'zh' ? '加载失败: ' + err.message : 'Failed: ' + err.message;
            area.innerHTML = '<div class="error">' + msg + '</div>';
            toast.error(msg);
        }
    }

    async function loadFile(path) {
        currentPath = path;
        const area = document.getElementById('content-area');
        // 源码模式下切换文件：保持源码模式（图片无源码，走正常渲染）
        if (viewSourceMode && !/\.(png|jpe?g|gif|bmp|webp|svg|ico)$/i.test(path)) {
            loadFileSource(path);
            return;
        }
        area.innerHTML = '<div class="welcome">' + (currentLang === 'zh' ? '加载中...' : 'Loading...') + '</div>';

        const lower = path.toLowerCase();
        try {
            // HTML：iframe sandbox 承载（不加 allow-scripts，防恶意脚本逃逸）
            if (lower.endsWith('.html') || lower.endsWith('.htm')) {
                renderHTMLInIframe(path);
                return;
            }
            // 图片：直接 <img>
            if (/\.(png|jpe?g|gif|bmp|webp|svg|ico)$/i.test(path)) {
                area.innerHTML = '<div class="image-container"><img src="/' + pathID + '/' + encodeURI(path) + refQuery() + '" alt="' + escapeHtml(path) + '"></div>';
                return;
            }
            // md/txt/代码：后端返回 HTML 片段，前端注入。长内容前端分页。
            const cached = contentCache.get(path, false);
            if (cached !== null) {
                renderTextWithPagination(area, path, cached);
                return;
            }
            showLoadingProgress(area, currentLang === 'zh' ? '加载中...' : 'Loading...');
            const resp = await authFetch('/' + pathID + '/' + encodeURI(path) + refQuery());
            if (!resp.ok) {
                const msg = httpErrorMsg(resp, '加载失败（' + resp.status + '）', 'Failed to load (' + resp.status + ')');
                area.innerHTML = '<div class="error">' + msg + '</div>';
                toast.error(msg);
                return;
            }
            const html = await readWithProgress(resp);
            contentCache.set(path, false, html);
            renderTextWithPagination(area, path, html);
        } catch (err) {
            const msg = currentLang === 'zh' ? '加载失败: ' + err.message : 'Failed to load: ' + err.message;
            area.innerHTML = '<div class="error">' + msg + '</div>';
            toast.error(msg);
        }
    }

    function renderHTMLInIframe(path) {
        const area = document.getElementById('content-area');
        const fileURL = '/' + pathID + '/' + encodeURI(path) + refQuery();

        const cached = contentCache.get(path, false);
        if (cached !== null) { mountHTMLPreview(area, fileURL, cached); return; }

        showLoadingProgress(area, currentLang === 'zh' ? '加载中...' : 'Loading...');

        authFetch(fileURL).then(async resp => {
            if (!resp.ok) {
                const msg = httpErrorMsg(resp, '加载失败（' + resp.status + '）', 'Failed to load (' + resp.status + ')');
                area.innerHTML = '<div class="error">' + msg + '</div>';
                toast.error(msg);
                return;
            }
            const html = await readWithProgress(resp);
            contentCache.set(path, false, html);
            mountHTMLPreview(area, fileURL, html);
        }).catch(err => {
            const msg = currentLang === 'zh' ? '加载失败: ' + err.message : 'Failed to load: ' + err.message;
            area.innerHTML = '<div class="error">' + msg + '</div>';
            toast.error(msg);
        });
    }

    function mountHTMLPreview(area, fileURL, html) {
        const openText = currentLang === 'zh' ? '在新标签页打开' : 'Open in new tab';
        const srcText = currentLang === 'zh' ? '查看源码' : 'View source';
        const notice = document.createElement('div');
        notice.className = 'html-notice';
        const noticeText = currentLang === 'zh'
            ? '⚠️ HTML 在隔离的沙箱中显示（禁用脚本）。'
            : '⚠️ HTML is shown in a sandboxed iframe (scripts disabled).';
        notice.innerHTML = noticeText
            + '<a href="' + fileURL + '" target="_blank">' + openText + '</a>'
            + '<a href="' + fileURL + (fileURL.indexOf('?') >= 0 ? '&' : '?') + 'raw=1" target="_blank">' + srcText + '</a>';

        const iframe = document.createElement('iframe');
        iframe.className = 'html-frame';
        // 用 srcdoc 注入内容：这样鉴权头只走主页面 fetch，不依赖 iframe 自身请求。
        // 同时 sandbox 不加 allow-scripts，防止不可信仓库的恶意脚本逃逸。
        iframe.setAttribute('sandbox', 'allow-same-origin');
        iframe.srcdoc = html;
        area.innerHTML = '';
        area.appendChild(notice);
        area.appendChild(iframe);
    }

    // 前端分页：按渲染片段的行数切，每页 maxLines 行。
    function renderTextWithPagination(area, path, html) {
        // html 是后端渲染的片段（<pre><code>... 或 markdown 的 HTML）
        // 检测是否为 <pre><code>（纯文本），按行切；markdown 内容不分页（避免截断标签）
        if (html.startsWith('<pre><code>')) {
            const raw = html.slice('<pre><code>'.length, html.length - '</code></pre>'.length);
            const lines = raw.split('\n');
            const maxLines = 1000;
            if (lines.length <= maxLines) {
                area.innerHTML = '<div class="code-container"><div class="code-content"><pre><code>' + raw + '</code></pre></div></div>';
                applyLineNumbers();
                return;
            }
            let page = 0;
            const totalPages = Math.ceil(lines.length / maxLines);
            function renderPage(p) {
                const start = p * maxLines, end = Math.min(start + maxLines, lines.length);
                const pageContent = lines.slice(start, end).join('\n');
                const container = document.createElement('div');
                container.className = 'code-container';
                const zh = currentLang === 'zh';
                const linesLabel = zh ? '行' : 'Lines';
                const pageLabel = zh ? '第' : 'Page';
                const pageMid = zh ? ' / ' + totalPages + ' 页' : ' / ' + totalPages;
                const prevLabel = zh ? '上一页' : 'Prev';
                const nextLabel = zh ? '下一页' : 'Next';
                container.innerHTML = '<div class="code-header"><span class="code-filename">' + escapeHtml(path)
                    + ' (' + linesLabel + ' ' + (start + 1) + '-' + end + ' / ' + lines.length + ')</span></div>'
                    + '<div class="code-content"><pre><code>' + pageContent + '</code></pre></div>';
                const pager = document.createElement('div');
                pager.className = 'pagination';
                pager.innerHTML = '<button ' + (p === 0 ? 'disabled' : '') + ' data-p="' + (p - 1) + '">' + prevLabel + '</button>'
                    + '<span>' + pageLabel + ' ' + (p + 1) + pageMid + '</span>'
                    + '<button ' + (p === totalPages - 1 ? 'disabled' : '') + ' data-p="' + (p + 1) + '">' + nextLabel + '</button>';
                pager.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
                    const np = parseInt(b.dataset.p, 10);
                    if (!isNaN(np)) renderPage(np);
                }));
                container.appendChild(pager);
                area.innerHTML = '';
                area.appendChild(container);
                applyLineNumbers(); // 分页切页后重挂行号
                area.scrollTop = 0;
            }
            renderPage(page);
        } else {
            // markdown 渲染结果：直接注入（不分页，goldmark 已是结构化 HTML）
            area.innerHTML = '<div class="markdown-body">' + html + '</div>';
        }
    }

    // ---------- 首屏：自动加载 README ----------
    function autoOpenDefault() {
        const candidates = ['README.md', 'readme.md', 'README.MD', 'index.html', 'README.txt', 'README'];
        for (const c of candidates) {
            if (allFiles.some(f => f.path === c)) {
                loadFile(c);
                // 高亮文件树
                const target = document.querySelector('.file-item[data-path="' + c + '"]');
                if (target) target.classList.add('active');
                return;
            }
        }
    }

    // ---------- 浮窗交互 ----------
    // 位置持久化：气泡、窗口各自的 left/top 存 localStorage。
    const POS_KEY = 'gitweb_viewer_pos';
    function loadPos() { try { return JSON.parse(localStorage.getItem(POS_KEY)) || {}; } catch (e) { return {}; } }
    function savePos(patch) {
        const cur = loadPos();
        localStorage.setItem(POS_KEY, JSON.stringify(Object.assign(cur, patch)));
    }

    function vvH() {
        return (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    }

    // 通用拖动：在 handle(s) 上按下时移动 el。handle 可为元素或数组。
    // onMove 可选，用于实时存储位置 / 边缘吸附反馈；阈值过滤纯点击（移动小于 4px 视为点击）。
    // opts.allowOverflow: 允许拖出视口（用于贴边半隐入）。onMove 收到 (x,y,edge)，edge 为最近边
    // 'left'|'right'|'top'|'bottom' 及到该边距离 dist；onEnd 收到 (moved, x, y, edge, dist)。
    function makeDraggable(el, handle, opts) {
        opts = opts || {};
        const handles = Array.isArray(handle) ? handle : [handle];
        let dragging = false, startX = 0, startY = 0, ox = 0, oy = 0, moved = false;
        let lastX = 0, lastY = 0, lastEdge = null, lastDist = Infinity;

        const down = (clientX, clientY, e) => {
            if (opts.ignoreOn && opts.ignoreOn(e)) return;
            dragging = true; moved = false;
            startX = clientX; startY = clientY;
            const r = el.getBoundingClientRect();
            ox = clientX - r.left; oy = clientY - r.top;
            el.classList.add('dragging');
            if (opts.onStart) opts.onStart();
        };
        const move = (clientX, clientY) => {
            if (!dragging) return;
            const dx = clientX - startX, dy = clientY - startY;
            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
            const w = el.offsetWidth, h = el.offsetHeight;
            let x = clientX - ox, y = clientY - oy;
            if (opts.allowOverflow) {
                // 允许部分超出视口（贴边半隐入），但仍保留至少一部分可见
                x = Math.max(-w + 16, Math.min(x, window.innerWidth - 16));
                y = Math.max(-h + 16, Math.min(y, vvH() - 16));
            } else {
                x = Math.max(0, Math.min(x, window.innerWidth - w));
                y = Math.max(0, Math.min(y, vvH() - h));
            }
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.right = 'auto'; el.style.bottom = 'auto';
            // 计算元素边缘到视口边缘的距离（允许负数=超出）
            const edges = {
                left: x, right: window.innerWidth - (x + w),
                top: y, bottom: vvH() - (y + h)
            };
            let edge = 'left', dist = edges.left;
            for (const k in edges) { if (edges[k] < dist) { dist = edges[k]; edge = k; } }
            lastX = x; lastY = y; lastEdge = edge; lastDist = dist;
            if (opts.onMove) opts.onMove(x, y, edge, dist);
        };
        const up = () => {
            if (!dragging) return;
            dragging = false;
            el.classList.remove('dragging');
            if (opts.onEnd) opts.onEnd(moved, lastX, lastY, lastEdge, lastDist);
        };

        handles.forEach(h => {
            h.addEventListener('mousedown', e => { down(e.clientX, e.clientY, e); e.preventDefault(); });
            h.addEventListener('touchstart', e => { const t = e.touches[0]; down(t.clientX, t.clientY, e); }, { passive: true });
            h.style.touchAction = 'none';
        });
        document.addEventListener('mousemove', e => move(e.clientX, e.clientY));
        document.addEventListener('mouseup', up);
        document.addEventListener('touchmove', e => {
            if (!dragging) return;
            const t = e.touches[0]; move(t.clientX, t.clientY);
            e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchend', up);

        return {
            didMove: () => moved,
            resetMoved: () => { moved = false; }
        };
    }

    function initFloatingTree() {
        const win = document.getElementById('floating-tree-window');
        const titlebar = document.getElementById('floating-tree-titlebar');
        const minimize = document.getElementById('minimize-btn');
        const minDock = document.getElementById('min-dock');
        if (!win) return;

        // 同步真实 header 高度到 CSS 变量 --header-h，供 dock 侧栏顶部位置与标题栏高度对齐。
        // viewer-header 高度随内容/字号变化，写死 52px 会让 dock 分隔线与页头下边框错位。
        function syncHeaderH() {
            const h = document.querySelector('.viewer-header');
            if (!h) return;
            const real = Math.round(h.getBoundingClientRect().height);
            if (real > 0) document.documentElement.style.setProperty('--header-h', real + 'px');
        }
        syncHeaderH();
        window.addEventListener('resize', syncHeaderH);
        if (typeof ResizeObserver !== 'undefined') {
            const h = document.querySelector('.viewer-header');
            if (h) (new ResizeObserver(syncHeaderH)).observe(h);
        }

        const pos = loadPos();
        const SNAP_DIST = 12;        // 元素边缘离视口边 ≤ 此值才吸附（像素）
        const DOCK_SIZE = 48;        // 迷你浮岛逻辑尺寸（与 CSS 一致；视觉缩放靠 transform）
        const EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';      // 苹果大形变缓动
        const EASE_SNAP = 'cubic-bezier(0.32, 0.72, 0, 1)'; // 吸附滑入缓动

        // 恢复窗口位置/尺寸
        if (pos.winLeft != null) { win.style.left = pos.winLeft + 'px'; win.style.top = pos.winTop + 'px'; win.style.right = 'auto'; }
        if (pos.winWidth != null) win.style.width = pos.winWidth + 'px';
        if (pos.winHeight != null) win.style.height = pos.winHeight + 'px';

        // ---- 窗口拖动（仅标题栏；展开态） ----
        makeDraggable(win, titlebar, {
            ignoreOn: e => e.target.closest('button') != null, // 点按钮不拖
            onMove: (x, y) => savePos({ winLeft: x, winTop: y })
        });

        // 监听窗口尺寸变化（resize 句柄）持久化
        // 仅在浮窗态保存尺寸；docked 态的尺寸由 --dock-w/--dock-h 管理，不应覆盖浮窗尺寸
        if (window.ResizeObserver) {
            const ro = new ResizeObserver(entries => {
                for (const en of entries) {
                    if (!win.classList.contains('minimized') && !win.classList.contains('docked')) {
                        savePos({ winWidth: en.contentRect.width, winHeight: en.contentRect.height });
                    }
                }
            });
            ro.observe(win);
        }

        // ---- 真实尺寸/位置过渡动画（替代 FLIP scale 方案）----
        // 让窗口从当前展开尺寸/位置"真实地"缩小到 48×48 浮岛（或反向还原），
        // 由 CSS transition 驱动 width/height/left/top/border-radius/background，
        // 不用 transform scale 反向放大，避免 Invert 阶段出现"大框体"闪过。
        // apply: 切到目标态（设 minimized class 或展开尺寸/位置）；dir: minimize/restore。
        function morphTo(apply, dir) {
            if (win.classList.contains('morphing')) return;
            const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduceMotion) { apply(); return; }
            // 记录当前展开态位置/尺寸，作为 transition 的起点（确保 inline style 有值）
            if (dir === 'minimize') {
                const r = win.getBoundingClientRect();
                if (pos.winLeft == null) { pos.winLeft = r.left; pos.winTop = r.top; savePos({ winLeft: r.left, winTop: r.top }); }
                if (pos.winWidth == null) { pos.winWidth = r.width; pos.winHeight = r.height; savePos({ winWidth: r.width, winHeight: r.height }); }
                win.style.width = r.width + 'px';
                win.style.height = r.height + 'px';
                win.style.left = r.left + 'px';
                win.style.top = r.top + 'px';
                win.style.right = 'auto';
                win.style.bottom = 'auto';
            }
            // 加 morphing class 启用尺寸/位置/圆角/背景 transition
            win.classList.add('morphing');
            // 强制 commit 起点样式，下一帧再 apply 切到目标态，触发 transition
            win.getBoundingClientRect();
            requestAnimationFrame(() => {
                apply();
                // minimize 时 apply 加了 minimized class（CSS width/height=48），但 inline
                // width/height 仍是展开尺寸会覆盖 class——必须清掉 inline，让 48×48 生效，
                // width/height 才会从展开尺寸过渡到 48。left/top 由 applyDockPos 设了 inline。
                if (dir === 'minimize') {
                    win.style.width = '';
                    win.style.height = '';
                    // 接近收尾时让图标淡入
                    setTimeout(() => {
                        if (win.classList.contains('morphing')) win.classList.add('morph-icon-in');
                    }, 180);
                }
            });
            const DUR = 340;
            let finished = false;
            const finish = () => {
                if (finished) return;
                finished = true;
                win.classList.remove('morphing', 'morph-icon-in');
                if (dir === 'restore') {
                    // 还原后保存位置/尺寸
                    savePos({ winLeft: parseFloat(win.style.left), winTop: parseFloat(win.style.top),
                              winWidth: parseFloat(win.style.width), winHeight: parseFloat(win.style.height) });
                }
            };
            // transitionend 监听 width（最长稳定属性）
            win.addEventListener('transitionend', function te(e) {
                if (e.propertyName !== 'width' && e.propertyName !== 'left') return;
                win.removeEventListener('transitionend', te);
                finish();
            });
            setTimeout(finish, DUR + 100);
        }

        // ---- FLIP 形变：把"宽高变化"合成成一次 transform 动画，不 reflow、不闪烁。
        // 记录 First(旧 rect) → 切到目标态读 Last(新 rect) → Invert(transform 把新态拉回旧视觉)
        // → Play(下一帧 transform 过渡到目标态的 transform)。
        // dir: 'minimize'（缩为浮岛）或 'restore'（从浮岛还原）。决定 min-dock 图标
        // 的淡入/淡出时机——避免收缩时 SVG 跟着大窗口 scale 被放大成"大图标缩小"闪现。
        function flipMorph(applyTarget, done, dir) {
            // 重入保护：正在形变中直接忽略，防止快速连点导致动画叠加、监听累积
            if (win.classList.contains('morphing')) return;
            const first = win.getBoundingClientRect();
            applyTarget();                       // 切 class / 设尺寸
            // 尊重 prefers-reduced-motion：直接到位，不做 FLIP 动画
            const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduceMotion) { if (done) done(); return; }
            // 强制布局，读 Last
            const last = win.getBoundingClientRect();
            const sx = first.width / last.width;
            const sy = first.height / last.height;
            const dx = first.left - last.left;
            const dy = first.top - last.top;
            if (!isFinite(sx) || !isFinite(sy) || (sx === 1 && sy === 1 && dx === 0 && dy === 0)) {
                if (done) done(); return;
            }
            // 目标态自身的 transform（如吸附 scale）；FLIP 的位移/缩放叠加其上
            const targetTx = getComputedStyle(win).transform;
            const base = targetTx === 'none' ? '' : targetTx;
            // 方向 class：minimize 起点透明、收尾淡入；restore 起点可见、开场淡出。
            // restore 的淡出在 Play 帧才触发，Invert 期间仍以"可见"还原旧视觉。
            const dirCls = dir === 'restore' ? 'morph-dir-restore' : 'morph-dir-minimize';
            win.classList.add('morphing', dirCls);
            win.style.transition = 'none';
            // Invert：在新位置上用 transform 还原到旧视觉
            win.style.transform = base + ' translate(' + dx + 'px,' + dy + 'px) scale(' + sx + ',' + sy + ')';
            // 强制 commit Invert 态
            win.getBoundingClientRect();
            const DUR = 340;
            const FADE_IN_DELAY = DUR - 120; // 与 CSS 100ms 淡入配合：220ms 开始 → 320ms 结束（早于 340ms）
            let finished = false;
            let fadeTimer = null;
            // Play：下一帧切到目标 transform，带缓动
            requestAnimationFrame(() => {
                win.style.transition = 'transform ' + DUR + 'ms ' + EASE;
                win.style.transform = base;      // 回到目标态
                if (dir === 'restore') {
                    // 还原：开场即淡出图标，避免它被 scale 放大后又突然消失
                    win.classList.add('morphing-icon-out');
                } else {
                    // 收缩：延迟到形变接近收尾再淡入图标，窗口此时已接近浮岛尺寸，
                    // 图标以"正常大小"出现，不会被 scale 放大成大图标再缩小。
                    fadeTimer = setTimeout(() => {
                        fadeTimer = null;
                        if (win.classList.contains('morphing')) win.classList.add('morphing-icon-in');
                    }, FADE_IN_DELAY);
                }
            });
            const finish = () => {
                if (finished) return;          // 幂等：transitionend 与超时兜底都可能触发
                finished = true;
                if (fadeTimer) { clearTimeout(fadeTimer); fadeTimer = null; }
                win.classList.remove('morphing', 'morph-dir-minimize', 'morph-dir-restore');
                win.classList.remove('morphing-icon-in', 'morphing-icon-out');
                win.style.transition = '';
                win.style.transform = '';
                if (done) done();
            };
            win.addEventListener('transitionend', function te(e) {
                if (e.propertyName !== 'transform') return;
                win.removeEventListener('transitionend', te);
                finish();
            });
            // 兜底：超时也结束（略大于 DUR，保证收尾淡入能完成）
            setTimeout(finish, DUR + 80);
        }

        // ---- 缩为迷你浮岛（带 FLIP） ----
        function toMiniIsland(skipAnim) {
            // 若当前是停靠态，先退出停靠再最小化（避免 docked 与 minimized class 共存冲突）
            if (win.classList.contains('docked')) undock();
            // 首次最小化：把浮岛放到右下角附近（若没有保存位置）
            if (pos.dockLeft == null) {
                const x = window.innerWidth - 56, y = vvH() - 56;
                pos.dockLeft = x; pos.dockTop = y; pos.dockSnap = null;
            } else {
                // 已有保存位置：检查是否还在当前视口内（横竖屏切换后可能越界）
                const w = 56, h = 56;
                if (pos.dockLeft > window.innerWidth - w || pos.dockTop > vvH() - h ||
                    pos.dockLeft < 0 || pos.dockTop < 0) {
                    pos.dockLeft = window.innerWidth - 56;
                    pos.dockTop = vvH() - 56;
                    pos.dockSnap = null;
                }
            }
            const apply = () => {
                applyDockPos(pos.dockLeft, pos.dockTop, pos.dockSnap);
                win.classList.add('minimized');
            };
            if (skipAnim) {
                // 启动时直接切迷你态，不做动画（避免与 win-pop 入场动画的 transform 冲突）
                win.style.transition = 'none';
                win.style.animation = 'none';
                apply();
                win.getBoundingClientRect(); // commit
                win.style.transition = '';
                win.style.animation = '';
            } else {
                // 真实尺寸/位置过渡：先用 morphing class 启用 width/height/left/top/border-radius/
                // background 的 CSS transition，下一帧再切到 minimized 目标态，让窗口"真实地"
                // 从展开尺寸缩小到 48×48 浮岛，不会出现 FLIP scale 反向放大导致的大框体闪过。
                morphTo(apply, 'minimize');
            }
        }
        function fromMiniIsland() {
            // 先计算展开态目标尺寸与位置，避免在 minimized 48×48 状态下读取 offsetWidth 错误
            const vw = window.innerWidth, vh = vvH();
            const targetW = Math.min(pos.winWidth || 320, Math.max(220, vw * 0.9));
            const targetH = Math.min(pos.winHeight || 520, Math.max(180, vh * 0.72));
            let targetX = pos.winLeft;
            let targetY = pos.winTop;
            const inView = targetX != null
                && targetX >= -targetW * 0.5 && targetX <= vw - targetW * 0.5
                && targetY != null && targetY >= 0 && targetY <= vh - 40;
            if (!inView) {
                targetX = Math.max(24, vw - targetW - 24);
                targetY = 80;
            }
            const apply = () => {
                win.classList.remove('minimized', 'snapped', 'snap-left', 'snap-right', 'snap-top', 'snap-bottom');
                win.style.width = targetW + 'px';
                win.style.height = targetH + 'px';
                win.style.left = targetX + 'px';
                win.style.top = targetY + 'px';
                win.style.right = 'auto';
                win.style.bottom = 'auto';
            };
            morphTo(apply, 'restore');
        }

        // ---- 停靠态（DevTools 风格：左 / 底 / 右） ----
        // 与 minimized/snapped 互斥。长按"-"按钮弹停靠菜单选择方向；单击"-"仍是缩为浮岛。
        const dockSideMenu = document.getElementById('dock-side-menu');
        const contentArea = document.getElementById('content-area');

        function dockTo(side) {
            // 清掉浮岛态残留 class 与内联位置（停靠态由 CSS 接管定位）
            win.classList.remove('minimized', 'snapped', 'snap-left', 'snap-right', 'snap-top', 'snap-bottom');
            win.style.left = ''; win.style.top = ''; win.style.right = ''; win.style.bottom = ''; win.style.width = ''; win.style.height = '';
            win.classList.remove('docked-left', 'docked-right', 'docked-bottom');
            win.classList.add('docked', 'docked-' + side);
            restoreDockSize();
            applyContentInset(side);
            pos.dockSide = side;
            savePos({ dockSide: side });
            hideDockMenu();
            // 显示标题栏切换按钮
            if (dockSwitchBtn) dockSwitchBtn.style.display = 'flex';
        }
        function undock(restoreX, restoreY) {
            win.classList.remove('docked', 'docked-left', 'docked-right', 'docked-bottom');
            clearContentInset();
            pos.dockSide = null;
            savePos({ dockSide: null });
            // 隐藏标题栏切换按钮
            if (dockSwitchBtn) dockSwitchBtn.style.display = 'none';
            hideDockMenu();
            // 恢复到浮窗态：优先用拖拽撕下来的位置，否则回上次保存的窗口位置，再否则回 CSS 默认
            if (restoreX != null) {
                win.style.left = restoreX + 'px'; win.style.top = restoreY + 'px'; win.style.right = 'auto';
                savePos({ winLeft: restoreX, winTop: restoreY });
            } else if (pos.winLeft != null) {
                win.style.left = pos.winLeft + 'px'; win.style.top = pos.winTop + 'px'; win.style.right = 'auto';
            } else {
                win.style.left = ''; win.style.top = ''; win.style.right = '';
            }
        }
        // 停靠时给内容区让位：左/右停靠留侧边 padding，底停靠留底部 padding。
        // dock 窗口从 header 下方开始（top: var(--header-h)），不与 header 重叠，
        // 因此只需给 content-area 让位，无需调整 header padding。
        // 用 px 直接设，宽度跟着浮窗实际尺寸走（resize 后由 ResizeObserver 同步）。
        function applyContentInset(side) {
            if (!contentArea) return;
            clearContentInset();
            const w = win.offsetWidth, h = win.offsetHeight;
            if (side === 'left')  contentArea.style.paddingLeft   = (w + 12) + 'px';
            if (side === 'right') contentArea.style.paddingRight  = (w + 12) + 'px';
            if (side === 'bottom') contentArea.style.paddingBottom = (h + 12) + 'px';
        }
        function clearContentInset() {
            if (!contentArea) return;
            contentArea.style.paddingLeft = '';
            contentArea.style.paddingRight = '';
            contentArea.style.paddingBottom = '';
        }

        // ---- 停靠态拖边缘改宽/高 ----
        // 鼠标靠近停靠浮窗的可拖拽边缘（12px 检测区）时启动 resize。
        // 左停靠拖右边、右停靠拖左边、底停靠拖上边。
        // 注意：检测区 24px（触屏 32px）更易抓取；cursor 由 CSS ::after hot zone 提示。
        let resizing = false, resizeStart = 0, resizeStartSize = 0, resizeSide = null;
        function startResize(e) {
            if (!win.classList.contains('docked')) return;
            if (e.target && e.target.closest && e.target.closest('button')) return; // 点按钮不调尺寸
            const side = pos.dockSide;
            const r = win.getBoundingClientRect();
            // 触屏用更宽的热区，桌面适度放宽
            const isTouch = e && e.pointerType === 'touch';
            const EDGE = isTouch ? 32 : 24;
            let canResize = false;
            if (side === 'left' && Math.abs(e.clientX - r.right) < EDGE) { canResize = true; resizeSide = 'ew'; resizeStart = e.clientX; resizeStartSize = r.width; }
            else if (side === 'right' && Math.abs(e.clientX - r.left) < EDGE) { canResize = true; resizeSide = 'ew'; resizeStart = e.clientX; resizeStartSize = r.width; }
            else if (side === 'bottom' && Math.abs(e.clientY - r.top) < EDGE) { canResize = true; resizeSide = 'ns'; resizeStart = e.clientY; resizeStartSize = r.height; }
            if (!canResize) return;
            resizing = true;
            e.preventDefault();
            e.stopPropagation();
        }
        win.addEventListener('mousedown', e => { startResize(e); }, true);
        document.addEventListener('mousemove', e => {
            if (!resizing) return;
            const side = pos.dockSide;
            if (resizeSide === 'ew') {
                let delta;
                if (side === 'left') delta = e.clientX - resizeStart;
                else delta = resizeStart - e.clientX; // right: 左边线往左拖=变宽
                const w = Math.max(180, Math.min(resizeStartSize + delta, window.innerWidth * 0.6));
                win.style.setProperty('--dock-w', w + 'px');
                applyContentInset(side);
            } else if (resizeSide === 'ns') {
                const delta = resizeStart - e.clientY; // 底停靠：上边线往上拖=变高
                const h = Math.max(120, Math.min(resizeStartSize + delta, vvH() * 0.7));
                win.style.setProperty('--dock-h', h + 'px');
                applyContentInset(side);
            }
        });
        document.addEventListener('mouseup', () => {
            if (!resizing) return;
            resizing = false;
            // 持久化尺寸
            const side = pos.dockSide;
            if (side === 'left' || side === 'right') savePos({ dockW: win.offsetWidth });
            else if (side === 'bottom') savePos({ dockH: win.offsetHeight });
        });
        // 触屏 resize：只认直接落在窗口本体上的触摸（边缘 ::after 热区/边框，
        // 伪元素命中会报告宿主元素）。落在标题栏/文件树等内容子元素上的触摸
        // 一律不进 resize，否则树内靠边缘的滑动会被 preventDefault 劫持成调宽，
        // 页面滚不动。热区在触屏上由 CSS 加宽到 16px，配合 docked 的 touch-action:none
        // 保证热区内手势不被浏览器抢成滚动。
        win.addEventListener('touchstart', e => {
            if (!win.classList.contains('docked')) return;
            if (e.target !== win) return;
            const t = e.touches[0];
            startResize({ clientX: t.clientX, clientY: t.clientY, pointerType: 'touch',
                          target: e.target, preventDefault: () => {}, stopPropagation: () => e.stopPropagation() });
        }, { capture: true, passive: true });
        document.addEventListener('touchmove', e => {
            if (!resizing) return;
            const t = e.touches[0];
            document.dispatchEvent(new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY }));
            e.preventDefault();
        }, { passive: false });
        // 触屏结束必须重置 resizing，否则 iOS Safari 上手指抬起后 sliding 页面时
        // touchmove 仍命中 resizing 分支被 preventDefault 拦截，页面滚不动、还在调高度。
        document.addEventListener('touchend', () => {
            if (!resizing) return;
            resizing = false;
            const side = pos.dockSide;
            if (side === 'left' || side === 'right') savePos({ dockW: win.offsetWidth });
            else if (side === 'bottom') savePos({ dockH: win.offsetHeight });
        });
        document.addEventListener('touchcancel', () => { resizing = false; });

        // 恢复保存的停靠尺寸
        function restoreDockSize() {
            if (pos.dockW != null) win.style.setProperty('--dock-w', pos.dockW + 'px');
            if (pos.dockH != null) win.style.setProperty('--dock-h', pos.dockH + 'px');
        }

        // ---- 停靠态拖拽标题栏 → 撕下来变回浮窗 ----
        // 单独处理，capture 阶段拦截，避免与 makeDraggable（bubble 阶段）冲突。
        // 移动超过 4px 才 undock 并让浮窗跟手：双击手势里 1-2px 的手抖很常见，
        // 无阈值会把"双击停靠/退出"误判成撕下，布局来回跳。
        let dockTearing = false, tearOX = 0, tearOY = 0, tearFired = false;
        let tearStartX = 0, tearStartY = 0, tearMoved = false;
        function startTear(clientX, clientY) {
            if (!win.classList.contains('docked')) return false;
            const r = win.getBoundingClientRect();
            tearOX = clientX - r.left;
            tearOY = clientY - r.top;
            tearStartX = clientX; tearStartY = clientY;
            tearFired = false;
            dockTearing = true;
            return true;
        }
        function moveTear(clientX, clientY) {
            if (!dockTearing) return;
            if (!tearFired) {
                if (Math.abs(clientX - tearStartX) <= 4 && Math.abs(clientY - tearStartY) <= 4) return;
                // 首次有效移动：退出停靠，浮窗跳到鼠标下跟手
                undock(clientX - tearOX, clientY - tearOY);
                win.classList.add('dragging');
                tearFired = true;
                tearMoved = true;
            }
            win.style.left = (clientX - tearOX) + 'px';
            win.style.top = (clientY - tearOY) + 'px';
            win.style.right = 'auto'; win.style.bottom = 'auto';
        }
        function endTear() {
            if (!dockTearing) return;
            dockTearing = false;
            win.classList.remove('dragging');
            // 撕下后的落点才是最终位置：undock 时存的是起手点，这里补存终态
            if (tearFired) savePos({ winLeft: parseFloat(win.style.left), winTop: parseFloat(win.style.top) });
        }
        titlebar.addEventListener('mousedown', e => {
            if (e.target.closest('button')) return;       // 点按钮（如"-"）不撕
            if (startTear(e.clientX, e.clientY)) { e.preventDefault(); e.stopPropagation(); }
        }, true);
        document.addEventListener('mousemove', e => moveTear(e.clientX, e.clientY));
        document.addEventListener('mouseup', endTear);
        titlebar.addEventListener('touchstart', e => {
            const t = e.touches[0];
            if (e.target.closest('button')) return;
            if (startTear(t.clientX, t.clientY)) { e.stopPropagation(); }
        }, { capture: true, passive: true });
        document.addEventListener('touchmove', e => {
            if (!dockTearing) return;
            const t = e.touches[0]; moveTear(t.clientX, t.clientY);
            e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchend', endTear);
        // 停靠态下宽度/高度变化时同步让位（用户拖边缘改尺寸）
        if (window.ResizeObserver && contentArea) {
            const dro = new ResizeObserver(() => {
                if (win.classList.contains('docked')) {
                    const side = pos.dockSide;
                    if (side) applyContentInset(side);
                }
            });
            dro.observe(win);
        }

        // ---- 停靠菜单显隐 + 定位 ----
        const dockSwitchBtn = document.getElementById('dock-switch-btn');
        function showDockMenu(anchorEl) {
            if (!dockSideMenu) return;
            const r = (anchorEl || minimize).getBoundingClientRect();
            dockSideMenu.style.display = 'flex';
            const mw = dockSideMenu.offsetWidth;
            let left = r.left + r.width / 2 - mw / 2;
            left = Math.max(8, Math.min(left, window.innerWidth - mw - 8));
            dockSideMenu.style.left = left + 'px';
            dockSideMenu.style.top = (r.bottom + 6) + 'px';
        }
        function hideDockMenu() {
            if (dockSideMenu) dockSideMenu.style.display = 'none';
        }
        if (dockSideMenu) {
            dockSideMenu.querySelectorAll('.dock-side-btn').forEach(b => {
                b.addEventListener('click', e => {
                    e.stopPropagation();
                    const side = b.dataset.side;
                    if (side) dockTo(side);
                });
            });
            document.addEventListener('mousedown', e => {
                if (dockSideMenu.style.display === 'none') return;
                if (!dockSideMenu.contains(e.target) && e.target !== dockSwitchBtn && e.target !== minimize) hideDockMenu();
            });
        }
        // 停靠切换按钮（标题栏向下箭头）：点击弹停靠菜单
        if (dockSwitchBtn) {
            dockSwitchBtn.addEventListener('click', e => {
                e.stopPropagation();
                if (dockSideMenu.style.display === 'none') showDockMenu(dockSwitchBtn);
                else hideDockMenu();
            });
        }

        // ---- 双击标题栏 → 停靠（竖屏底部 / 横屏左侧）；停靠态双击 → 退出停靠 ----
        // 单击标题栏仍走 makeDraggable 的拖拽逻辑（不冲突：dblclick 是独立事件）。
        let lastTitleClick = 0;
        titlebar.addEventListener('click', e => {
            if (e.target.closest('button')) return; // 点按钮不算
            // 刚完成一次"撕下浮窗"拖拽：松手带出的 click 不参与双击计数，
            // 否则拖完紧接一次单击会被误判成双击又停靠回去。
            if (tearMoved) { tearMoved = false; lastTitleClick = 0; return; }
            const now = Date.now();
            if (now - lastTitleClick < 350) {
                // 双击
                e.preventDefault();
                e.stopPropagation();
                lastTitleClick = 0;
                if (win.classList.contains('docked')) undock();
                else dockTo(isPortrait() ? 'bottom' : 'left');
            } else {
                lastTitleClick = now;
            }
        });

        // minimize 按钮：单击缩小（浮窗态）/ 退出停靠（停靠态）
        minimize.addEventListener('click', e => {
            e.stopPropagation();
            hideDockMenu();
            if (win.classList.contains('docked')) {
                undock();
            } else {
                toMiniIsland();
            }
        });

        // 双击文件项：自动 dock 文件树让出内容区。
        // 竖屏（高度 > 宽度，如手机）默认 dock 到底部；横屏默认 dock 到左侧。
        // 已 docked 时双击改为 undock（与标题栏双击行为一致）。
        // 用事件委托：文件树内容会随刷新重渲染，委托到容器避免每次 rebind。
        const treeContent = document.querySelector('.floating-tree-content');
        // 检测瘦长屏幕（手机竖屏）：高度 > 宽度。
        // iOS Safari 上 innerWidth/innerHeight 虽受工具栏影响数值变化，
        // 但宽高关系对方向判断是准的，最简单可靠。
        function isPortrait() {
            return window.innerHeight > window.innerWidth;
        }
        function handleFileDblDock() {
            if (win.classList.contains('docked')) {
                undock();
                return;
            }
            dockTo(isPortrait() ? 'bottom' : 'left');
        }
        // 横竖屏切换：若浮岛位置越界，重新放到右下角可见区
        function onOrientForMinimized() {
            if (!win.classList.contains('minimized')) return;
            if (pos.dockLeft == null) return;
            const w = 56, h = 56;
            if (pos.dockLeft > window.innerWidth - w || pos.dockTop > vvH() - h ||
                pos.dockLeft < 0 || pos.dockTop < 0) {
                pos.dockLeft = window.innerWidth - 56;
                pos.dockTop = vvH() - 56;
                pos.dockSnap = null;
                applyDockPos(pos.dockLeft, pos.dockTop, pos.dockSnap);
                savePos({ dockLeft: pos.dockLeft, dockTop: pos.dockTop, dockSnap: null });
            }
        }
        window.addEventListener('orientationchange', () => setTimeout(onOrientForMinimized, 200));
        window.addEventListener('resize', onOrientForMinimized);
        // 移动 Chrome 地址栏显隐会改变可见视口高度（innerHeight 不变），
        // 监听 visualViewport.resize 把浮岛重新钳制回可见区，避免被地址栏挡住。
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', onOrientForMinimized);
        }
        if (treeContent) {
            // 统一用 click 事件做双击检测：iOS Safari 的 click 可靠触发，
            // dblclick 在移动端不可靠。记录上次 click 的目标 + 时间 + 位置，
            // 同一文件项 + 500ms 内 + 位置接近 → 触发双击。
            // 严格限制：只有 click 目标本身是 .file-item（或其子元素）才算数，
            // 避免双击文件树空白处 / 正文页面误触发。
            let lastClickItem = null, lastClickTime = 0, lastClickX = 0, lastClickY = 0;
            treeContent.addEventListener('click', e => {
                const item = e.target.closest('.file-item');
                if (!item) {
                    lastClickItem = null;
                    return;
                }
                const now = Date.now();
                const x = e.clientX, y = e.clientY;
                const sameItem = lastClickItem === item;
                const inTime = now - lastClickTime < 500;
                const closePos = Math.abs(x - lastClickX) < 30 && Math.abs(y - lastClickY) < 30;
                if (sameItem && inTime && closePos) {
                    e.preventDefault();
                    e.stopPropagation();
                    lastClickItem = null;
                    lastClickTime = 0;
                    handleFileDblDock();
                } else {
                    lastClickItem = item;
                    lastClickTime = now;
                    lastClickX = x;
                    lastClickY = y;
                }
            });
            // 桌面端 dblclick 兜底
            treeContent.addEventListener('dblclick', e => {
                if (!e.target.closest('.file-item')) return;
                if (lastClickItem === null && lastClickTime === 0) return;
                e.preventDefault();
                e.stopPropagation();
                lastClickItem = null;
                lastClickTime = 0;
                handleFileDblDock();
            });
        }

        // 应用浮岛位置 + 吸附态 class（位置用 left/top，缩放靠 .snapped 的 transform）
        function applyDockPos(x, y, snap) {
            win.style.left = x + 'px'; win.style.top = y + 'px';
            win.classList.toggle('snapped', !!snap);
            win.classList.remove('snap-left', 'snap-right', 'snap-top', 'snap-bottom');
            if (snap) win.classList.add('snap-' + snap);
        }

        // ---- 浮岛拖动：贴边吸附 + 半隐入 ----
        // 拖动中只跟手移动，不加 snapped class（避免 scale/圆角突变）；
        // 松手时判断是否贴近边缘，是则平滑滑入半隐入位（带缓动 + scale + 圆角过渡）。
        const dockDrag = makeDraggable(win, minDock, {
            allowOverflow: true,
            onStart: () => {
                // 拖动开始：脱离吸附态，恢复全尺寸（用户把浮岛"拿起来"了）
                win.classList.remove('snapped', 'snap-left', 'snap-right', 'snap-top', 'snap-bottom');
            },
            onMove: (x, y, edge, dist) => {
                // 纯跟手，不预览吸附态（松手才吸附）
                win.style.left = x + 'px'; win.style.top = y + 'px';
            },
            onEnd: (moved, x, y, edge, dist) => {
                if (!moved) return; // 纯点击交给 click 处理
                const snapped = dist <= SNAP_DIST ? edge : null;
                let fx = x, fy = y;
                if (snapped) {
                    // 半隐入：把逻辑 48 的中心压到边线（scale 0.75 围绕中心，视觉 36 即半隐入）
                    const s = DOCK_SIZE;
                    if (snapped === 'left') fx = -s / 2;
                    if (snapped === 'right') fx = window.innerWidth - s / 2;
                    if (snapped === 'top') fy = -s / 2;
                    if (snapped === 'bottom') fy = vvH() - s / 2;
                }
                // 松手滑入：给 left/top 一段短缓动，让"靠边→压边"是滑过去而非瞬移
                const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                win.style.transition = reduceMotion ? 'none' :
                    'left 0.26s ' + EASE_SNAP + ', top 0.26s ' + EASE_SNAP
                    + ', transform 0.26s ' + EASE_SNAP + ', box-shadow 0.28s ' + EASE
                    + ', border-radius 0.28s ' + EASE + ', background 0.28s ' + EASE;
                win.style.left = fx + 'px'; win.style.top = fy + 'px';
                win.classList.toggle('snapped', !!snapped);
                win.classList.remove('snap-left', 'snap-right', 'snap-top', 'snap-bottom');
                if (snapped) win.classList.add('snap-' + snapped);
                pos.dockLeft = fx; pos.dockTop = fy; pos.dockSnap = snapped;
                savePos({ dockLeft: fx, dockTop: fy, dockSnap: snapped });
                // 过渡结束后清掉行内 transition，恢复 CSS 默认（hover 等不受干扰）
                const clear = () => { win.style.transition = ''; win.removeEventListener('transitionend', clear); };
                win.addEventListener('transitionend', clear);
                setTimeout(() => { win.style.transition = ''; }, 320);
            }
        });

        // 浮岛点击（未拖动）恢复展开
        minDock.addEventListener('click', () => {
            if (dockDrag.didMove()) { dockDrag.resetMoved(); return; }
            fromMiniIsland();
        });

        // ---- 启动态：默认缩为迷你浮岛（便于展示正文），首次访问弹气泡引导 ----
        // 用户一旦手动展开过，记住偏好，之后默认展开，不再被反复收起打扰。
        const EXPAND_KEY = 'gitweb_tree_start_expanded';
        const BUBBLE_SEEN_KEY = 'gitweb_dock_bubble_seen';
        const bubble = document.getElementById('dock-bubble');
        const bubbleClose = document.getElementById('dock-bubble-close');

        function showBubble() {
            if (!bubble) return;
            // 气泡贴在浮岛左侧（浮岛在右下角）；用 fixed 跟随浮岛当前位置
            positionBubble();
            bubble.style.display = 'flex';
        }
        function hideBubble(persist) {
            if (bubble) bubble.style.display = 'none';
            if (persist) { try { localStorage.setItem(BUBBLE_SEEN_KEY, '1'); } catch (e) {} }
        }
        function positionBubble() {
            if (!bubble) return;
            const r = win.getBoundingClientRect();
            // 浮岛在右侧时气泡放左；贴左边缘时放右，避免溢出视口
            const onRight = r.left > window.innerWidth / 2;
            bubble.style.top = (r.top + r.height / 2) + 'px';
            if (onRight) {
                bubble.style.right = (window.innerWidth - r.left + 10) + 'px';
                bubble.style.left = 'auto';
                bubble.classList.remove('point-left');
                bubble.classList.add('point-right');
            } else {
                bubble.style.left = (r.right + 10) + 'px';
                bubble.style.right = 'auto';
                bubble.classList.remove('point-right');
                bubble.classList.add('point-left');
            }
        }

        const startExpanded = (() => { try { return localStorage.getItem(EXPAND_KEY) === '1'; } catch (e) { return false; } })();
        const bubbleSeen = (() => { try { return localStorage.getItem(BUBBLE_SEEN_KEY) === '1'; } catch (e) { return false; } })();

        win.classList.add('show');
        if (startExpanded) {
            // 已有偏好：直接展开，不弹气泡
            // 恢复上次停靠态（若存在）：展开偏好优先于停靠，但二者可共存——停靠本身也是展开
            if (pos.dockSide) {
                win.classList.remove('minimized', 'snapped', 'snap-left', 'snap-right', 'snap-top', 'snap-bottom');
                // 清除内联尺寸：docked 态宽度由 CSS var(--dock-w/--dock-h) 控制，
                // 内联 width/height 会覆盖 CSS class 导致 resize 设置 --dock-w 无效
                win.style.left = ''; win.style.top = ''; win.style.right = ''; win.style.bottom = '';
                win.style.width = ''; win.style.height = '';
                win.classList.add('docked', 'docked-' + pos.dockSide);
                restoreDockSize();
                applyContentInset(pos.dockSide);
                if (dockSwitchBtn) dockSwitchBtn.style.display = 'flex';
            }
        } else {
            // 默认缩为迷你浮岛（跳过 FLIP，避免与入场动画冲突）
            toMiniIsland(true);
            if (!bubbleSeen) {
                // 浮岛落位后再定位气泡，避免位置错乱
                setTimeout(showBubble, 60);
            }
        }

        // 任何展开动作都关掉气泡；首次展开同时记偏好，以后默认展开
        function onExpand() {
            hideBubble(true);
            try { localStorage.setItem(EXPAND_KEY, '1'); } catch (e) {}
        }
        minDock.addEventListener('click', onExpand);
        if (bubbleClose) {
            bubbleClose.addEventListener('click', e => { e.stopPropagation(); hideBubble(true); });
        }
        // 窗口尺寸变化时重新对齐气泡位置
        window.addEventListener('resize', () => { if (bubble && bubble.style.display !== 'none') positionBubble(); });
    }

    // ---------- 标题栏滚动自动隐藏（知乎同款：下滑藏、上滑显、贴顶常显） ----------
    function initAutoHideHeader() {
        const area = document.getElementById('content-area');
        const header = document.querySelector('.viewer-header');
        if (!area || !header) return;

        // head-hidden 会在滚动/悬停/触屏多处被切换，逐个改调用点容易漏；
        // 这里镜像到 <html>，让停靠侧栏的 top/height 能随页头收起一起上移。
        new MutationObserver(() => {
            document.documentElement.classList
                .toggle('head-hidden', header.classList.contains('head-hidden'));
        }).observe(header, { attributes: true, attributeFilter: ['class'] });

        let lastY = area.scrollTop;
        let ticking = false;
        const TOP_THRESHOLD = 8;   // 离顶小于此值视为贴顶，常显
        const DELTA = 6;           // 滚动距离小于此值忽略，避免抖动

        function update() {
            const y = area.scrollTop;
            const dy = y - lastY;
            if (y <= TOP_THRESHOLD) {
                header.classList.remove('head-hidden', 'head-scrolled');
            } else {
                header.classList.add('head-scrolled');
                if (Math.abs(dy) >= DELTA) {
                    // 下滑（dy>0）隐藏，上滑（dy<0）显示
                    header.classList.toggle('head-hidden', dy > 0);
                }
            }
            lastY = y;
            ticking = false;
        }
        area.addEventListener('scroll', () => {
            if (!ticking) { ticking = true; requestAnimationFrame(update); }
        }, { passive: true });

        // 鼠标移到顶部区域时临时唤回标题栏（便于点首页/删除）
        area.addEventListener('mousemove', e => {
            if (e.clientY < 60 && header.classList.contains('head-hidden')) {
                header.classList.remove('head-hidden');
                lastY = area.scrollTop; // 重置基线，避免立刻又被滚走
            }
        });

        // 触屏：iOS Safari 不派发 mousemove，需用 touchstart 在顶部唤回标题栏。
        // 否则下滑隐藏后在触屏上无路恢复，按钮永远点不到。
        area.addEventListener('touchstart', e => {
            if (!header.classList.contains('head-hidden')) return;
            const t = e.touches[0];
            if (t && t.clientY < 70) {
                header.classList.remove('head-hidden');
                lastY = area.scrollTop; // 重置基线，避免立刻又被滚走
            }
        }, { passive: true });
    }

    // ---------- 工具 ----------
    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function formatSize(b) {
        if (b < 1024) return b + ' B';
        if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
        return (b / 1048576).toFixed(1) + ' MB';
    }

    // ---------- 分支切换器 ----------
    // 点击 ref chip 弹出分支列表，选中后临时切换 currentRef（不写 state），重拉文件树。
    function initBranchSwitcher() {
        const trigger = document.getElementById('branch-trigger');
        const menu = document.getElementById('branch-menu');
        const nameEl = document.getElementById('branch-name');
        if (!trigger || !menu || !nameEl) return;

        let loaded = false;
        let branches = [];

        function isOpen() { return menu.classList.contains('open'); }

        function render() {
            if (!branches.length) {
                menu.innerHTML = '<div class="branch-menu-empty">' + (currentLang === 'zh' ? '无可切换分支' : 'No branches available') + '</div>';
                return;
            }
            menu.innerHTML = branches.map(b =>
                '<button type="button" class="branch-item' + (b === currentRef ? ' active' : '') +
                '" data-ref="' + escapeHtml(b) + '" role="option" aria-selected="' + (b === currentRef ? 'true' : 'false') + '">' +
                escapeHtml(b) + '</button>'
            ).join('');
            menu.querySelectorAll('.branch-item').forEach(btn => {
                btn.addEventListener('click', () => selectRef(btn.dataset.ref));
            });
        }

        async function load() {
            const zh = currentLang === 'zh';
            menu.innerHTML = '<div class="branch-menu-loading">' + (zh ? '加载中...' : 'Loading...') + '</div>';
            try {
                const resp = await authFetch('/api/sites/' + pathID + '/branches');
                if (!resp.ok) {
                    const msg = httpErrorMsg(resp, '加载分支失败（' + resp.status + '）', 'Failed to load branches (' + resp.status + ')');
                    menu.innerHTML = '<div class="branch-menu-error">' + msg + '</div>';
                    toast.error(msg);
                    return;
                }
                const data = await resp.json();
                branches = data.branches || [];
                loaded = true;
                render();
            } catch (err) {
                const msg = zh ? '加载分支失败: ' + err.message : 'Failed to load branches: ' + err.message;
                menu.innerHTML = '<div class="branch-menu-error">' + escapeHtml(msg) + '</div>';
                toast.error(msg);
            }
        }

        function selectRef(ref) {
            if (ref === currentRef) { close(); return; }
            currentRef = ref;
            contentCache.clear();
            nameEl.textContent = ref;
            close();
            // 重拉文件树；清空当前文件内容（旧分支的文件路径可能不存在）
            const area = document.getElementById('content-area');
            if (area) area.innerHTML = '<div class="welcome">' + (currentLang === 'zh' ? '切换到分支 ' : 'Switching to ') + escapeHtml(ref) + '...</div>';
            loadFileTree().then(autoOpenDefault);
            toast.info(currentLang === 'zh' ? '已切换到分支 ' + ref : 'Switched to ' + ref);
        }

        function openMenu() {
            trigger.setAttribute('aria-expanded', 'true');
            menu.classList.add('open');
            if (!loaded) load();
            else render(); // 已加载过则刷新 active 高亮（currentRef 可能已切换）
        }
        function close() {
            trigger.setAttribute('aria-expanded', 'false');
            menu.classList.remove('open');
        }
        function toggle() { isOpen() ? close() : openMenu(); }

        trigger.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
        document.addEventListener('click', (e) => { if (isOpen() && !menu.contains(e.target) && e.target !== trigger) close(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isOpen()) close(); });
    }

    // ---------- 启动 ----------
    document.addEventListener('DOMContentLoaded', () => {
        initFloatingTree();
        initTreeSearch();
        initAutoHideHeader();
        initBranchSwitcher();
        restoreAuthFromLocal();
        loadFileTree().then(autoOpenDefault);

        const refreshBtn = document.getElementById('refresh-tree-btn');
        if (refreshBtn) {
            refreshBtn.addEventListener('click', () => {
                if (refreshBtn.classList.contains('spinning')) return; // 防连点
                refreshBtn.classList.add('spinning');
                // 刷新是用户唯一的「给我最新内容」入口：不清内容缓存的话，
                // 点开文件仍会命中旧条目，这次刷新等于没刷。
                contentCache.clear();
                const content = document.getElementById('floating-tree-content');
                if (content) content.innerHTML = '<div class="tree-loading">' + (currentLang === 'zh' ? '刷新中...' : 'Refreshing...') + '</div>';
                loadFileTree().then(() => {
                    if (allFiles.length > 0) toast.success(currentLang === 'zh' ? '文件树已刷新' : 'Tree refreshed');
                }).finally(() => {
                    // 动画结束移除 class（animationend 兜底 + 超时兜底）
                    const done = () => refreshBtn.classList.remove('spinning');
                    refreshBtn.addEventListener('animationend', done, { once: true });
                    setTimeout(done, 900);
                });
            });
        }
    });
})();
</script>
</body>
</html>
